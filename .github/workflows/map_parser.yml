name: Map Bot Runner

on:
  repository_dispatch:
    types: [run_bot]
  workflow_dispatch:
    inputs:
      test_url:
        description: '在此輸入要測試的網址'
        required: true
        default: 'https://goo.gl/maps/example'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Map Handler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          echo "🗺️ [地圖核心] 啟動..."
          
          # --- 變數接收區 (對應 Make JSON) ---
          
          # 1. 訊息內容 (Make 傳過來的是 'message' 不是 'message_text')
          MSG="${{ github.event.client_payload.message || github.event.inputs.test_url }}"
          
          # 2. User ID
          USER_ID="${{ github.event.client_payload.user_id || 'manual_test_user' }}"
          
          # 3. Reply Token
          TOKEN="${{ github.event.client_payload.reply_token || '' }}"

          echo "測試模式: 輸入內容 -> $MSG"
          
          # 執行 Python (請確認你的 main.py 真的是在 ig_map 資料夾下，如果是在根目錄請把 ig_map/ 去掉)
          python ig_map/main.py "$MSG" "$USER_ID" "$TOKEN"
